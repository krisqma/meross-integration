# mosquitto.conf — broker dla mostu meross2mqtt i panelu webowego.
#
# Model bezpieczeństwa: broker nie ma uwierzytelniania, bo w docker-compose.yml port jest
# publikowany wyłącznie na loopbacku hosta ("127.0.0.1:1883:1883"). Z LAN-u nikt tu nie
# dojdzie, a w sieci Compose dochodzą tylko kontenery `bridge` i `webapp`. Dlatego listener
# poniżej słucha na wszystkich interfejsach WEWNĄTRZ kontenera — izolację daje mapowanie
# portu, nie bind address. Gdyby listener stał na 127.0.0.1, most i webapp nie miałyby jak
# się połączyć.
#
# PUŁAPKA, która potrafi zatrzymać cały stack: healthcheck w docker-compose.yml wykonuje
# anonimowe `mosquitto_sub -t '$SYS/broker/uptime'` z 127.0.0.1 w tym kontenerze. Gdyby dla
# listenera 1883 został włączony `acl_file`, anonimowy dostęp do $SYS by zniknął (reguły ACL
# dla anonimowych nie obejmują $SYS, o ile nie wypisze się go wprost), healthcheck by padł,
# a `bridge` i `webapp` mają `depends_on: condition: service_healthy`, więc nigdy by nie
# wstały. Stąd świadoma decyzja: na listenerze 1883 nie ma ACL-a w ogóle. Plik
# mosquitto/config/acl jest przygotowany wyłącznie dla przyszłego listenera TLS.

# ---------------------------------------------------------------------------
# Persystencja i logi
# ---------------------------------------------------------------------------
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# Logi idą i na stdout (widoczne w `docker compose logs mosquitto`), i do pliku
# na wolumenie ./mosquitto/log.
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_timestamp true
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

# ---------------------------------------------------------------------------
# per_listener_settings — uwaga na kolejność
# ---------------------------------------------------------------------------
# Ta opcja musi wystąpić PRZED jakimkolwiek `listener` i przed opcjami bezpieczeństwa,
# dlatego jej zakomentowane miejsce jest tutaj, a nie przy bloku TLS na końcu pliku.
# Włączamy ją dopiero razem z listenerem 8883 — wtedy `allow_anonymous` i `acl_file`
# obowiązują per listener, a nie globalnie. Dopóki jest wyłączona, `allow_anonymous true`
# poniżej działa globalnie.
#per_listener_settings true

# ---------------------------------------------------------------------------
# Listener lokalny: most + webapp
# ---------------------------------------------------------------------------
listener 1883
# `allow_anonymous` stoi celowo zaraz pod `listener 1883`: przy wyłączonym
# per_listener_settings jest ustawieniem globalnym, a po włączeniu tej opcji automatycznie
# staje się ustawieniem tego listenera. Odkomentowanie bloku TLS nie wymaga więc
# przestawiania tej linii.
allow_anonymous true
# Bez `acl_file` — patrz komentarz o healthchecku na górze pliku.

# ---------------------------------------------------------------------------
# PRZYSZŁOŚĆ (nieaktywne): listener TLS 8883 dla gniazdek Meross
# ---------------------------------------------------------------------------
# Dlaczego jeden broker z dwoma listenerami, a nie dwa brokery, jak radzi README mostu:
# dwa brokery i bridge między nimi rozwiązują trzy problemy, których u nas nie ma —
# gniazdka logują się MAC-iem (mosquitto nie przyjmuje `:` w password_file), wymagają TLS
# i trzeba przemapować prefiks `/appliance/`. W naszym wariancie gniazdka w ogóle nie łączą
# się z brokerem (most rozmawia z nimi po HTTP w LAN-ie), więc drugi broker to złożoność bez
# zysku. Ten blok jest furtką: gdyby kiedyś odcinać chmurę i parować gniazdka lokalnie,
# wystarczy go odkomentować — izolacja będzie taka sama jak przy osobnym brokerze, bo ACL
# zamyka anonimowych (czyli gniazdka) w `/appliance/#` i nie wpuszcza ich do `homie/#`.
#
# Zanim odkomentujesz:
#   1. odkomentuj `per_listener_settings true` wyżej (musi być przed listenerami),
#   2. wygeneruj certyfikaty do mosquitto/config/certs/ — CN certyfikatu serwera musi się
#      zgadzać z adresem, który wpiszesz gniazdkom w aplikacji parującej,
#   3. dopublikuj port 8883 w docker-compose.yml (na LAN, nie na loopback),
#   4. zrób `chmod 0700 mosquitto/config/acl` (mosquitto 2.1 ostrzega o world-readable),
#   5. sprawdź, czy healthcheck na listenerze 1883 nadal przechodzi.
#
# Uwaga na wersję brokera: eclipse-mosquitto 2.1.2 przy starcie z `per_listener_settings true`
# ostrzega, że ta opcja jest przestarzała i zniknie w 3.0, i podpowiada `listener_allow_anonymous`
# zamiast `allow_anonymous`. Na razie działa (i tak zapisuje to CONTRACT.md §3), ale przy
# realnym włączaniu TLS warto od razu przejść na wariant `listener_*`. Aktywna konfiguracja
# powyżej nie używa `per_listener_settings`, więc dziś broker startuje bez żadnych ostrzeżeń.
#
#listener 8883
# Gniazdka Meross podają MAC jako login, więc nie da się ich trzymać w password_file —
# wpuszczamy je anonimowo i ograniczamy ACL-em.
#allow_anonymous true
#acl_file /mosquitto/config/acl
#cafile /mosquitto/config/certs/ca.crt
#certfile /mosquitto/config/certs/broker.crt
#keyfile /mosquitto/config/certs/broker.key
#tls_version tlsv1.2
# Gniazdka nie mają certyfikatów klienta.
#require_certificate false
