# Broker na potrzeby testów integracyjnych — świadomie NIE jest to mosquitto/config/mosquitto.conf
# z produkcyjnego stacku. Środowisko testowe ma być samowystarczalne i niezależne od tego,
# co akurat robi konfiguracja produkcyjna (uwierzytelnianie, ACL, TLS).
#
# Broker stoi wyłącznie w wewnętrznej sieci Compose i nie jest publikowany na hosta,
# dlatego może być całkowicie otwarty.

listener 1883 0.0.0.0
allow_anonymous true

# Bez trwałości: każde `up` startuje z czystym stanem, żeby retained z poprzedniego
# przebiegu nie zafałszował testów.
persistence false
autosave_interval 0

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

# Statystyki $SYS co 5 s — na nich stoi healthcheck usługi.
sys_interval 5

max_queued_messages 10000
